# AnyKernel3 configuration for OPPO Reno (SDM710)
# Source: https://github.com/osm0sis/AnyKernel3

kernel.string=OPPO Reno (SDM710) KPM/KSU
kernel.author=GitHub Actions Cloud Build
kernel.prefix=OPRenoSDM710
kernel.suffix=-cloud

# Device validation (block=auto auto-detects boot partition)
do.device=1
do.modules=0
do.modules_vendor=0
block=auto
do.mount=0
do.init=0
do.init.rc=0
do.cpu_governor=0
do.cpufreq=0
do.frequency=0
do.overclock=0
do.vm=0
do.cleanup=1
do.backup=1
do.strip=0
do.compress=0

# Use Image.gz-dtb (compressed kernel + DTB appended)
do.dtb=1
do.bootdd=0
