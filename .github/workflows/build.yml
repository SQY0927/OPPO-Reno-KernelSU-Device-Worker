name: 编译 OPPO Reno SDM710 内核 (KPM / KSU+KPM / SukiSU+KPM)

on:
  workflow_dispatch:
    inputs:
      build_kpm_only:
        description: '编译 KPM-only 版本（不含 KernelSU）'
        type: boolean
        default: true
      build_ksu_kpm:
        description: '编译 KernelSU + KPM 版本'
        type: boolean
        default: true
      build_suki_kpm:
        description: '编译 SukiSU + KPM 版本'
        type: boolean
        default: true
  push:
    branches: [main, master]

env:
  # OPPO Reno (SDM710) 内核源码
  KERNEL_REPO: https://github.com/oppo-source/android_kernel_oppo_sdm710
  KERNEL_BRANCH: oppo/sdm710_r_11.0_reno
  DEFCONFIG: sdm670-perf_defconfig
  # KernelSU-Next（4.9 内核 FULL 源码集成）
  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next
  KSU_BRANCH: dev
  # SukiSU-Ultra（KernelSU 增强分支，内置 KPM）
  SUKI_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra
  SUKI_BRANCH: main
  # KernelPatch (KPM) - kpimg + kptools
  KPM_REPO: https://github.com/bmax121/KernelPatch
  # AnyKernel3 打包工具
  ANYKERNEL3_REPO: https://github.com/osm0sis/AnyKernel3
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    name: 编译 ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [kpm-only, ksu-kpm, suki-kpm]

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 判断是否跳过该变体
        id: variant_gate
        run: |
          SKIP="false"
          if [ "${{ matrix.variant }}" = "kpm-only" ] && [ "${{ github.event.inputs.build_kpm_only }}" = "false" ]; then SKIP="true"; fi
          if [ "${{ matrix.variant }}" = "ksu-kpm" ] && [ "${{ github.event.inputs.build_ksu_kpm }}" = "false" ]; then SKIP="true"; fi
          if [ "${{ matrix.variant }}" = "suki-kpm" ] && [ "${{ github.event.inputs.build_suki_kpm }}" = "false" ]; then SKIP="true"; fi
          echo "skip=$SKIP" >> $GITHUB_OUTPUT
          echo "输入参数: kpm_only=${{ github.event.inputs.build_kpm_only }} ksu_kpm=${{ github.event.inputs.build_ksu_kpm }} suki_kpm=${{ github.event.inputs.build_suki_kpm }}"

      - name: 跳过已禁用的变体
        if: steps.variant_gate.outputs.skip == 'true'
        run: |
          echo "变体 ${{ matrix.variant }} 已被禁用，跳过编译。"
          exit 0

      - name: 释放磁盘空间
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "== 清理前磁盘使用 =="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          echo "== 清理后磁盘使用 =="
          df -h /

      - name: 安装编译依赖
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libncurses5-dev libssl-dev libelf-dev \
            zip unzip curl wget git python3 ccache lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          # 内核 4.9 脚本使用 Python 2 语法，安装 python2 并设为默认
          sudo apt-get install -y python2 || true
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python || true
          python --version 2>&1 || echo "python2 未安装，将修复脚本兼容性"
          # 验证交叉编译器
          aarch64-linux-gnu-gcc --version | head -1

      - name: 恢复 ccache 缓存
        id: ccache-cache
        if: steps.variant_gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ matrix.variant }}-ccache-${{ env.KERNEL_BRANCH }}
          restore-keys: |
            ${{ matrix.variant }}-ccache-

      - name: 下载 Clang 工具链 (AOSP r383902 / Clang 11)
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          mkdir -p $HOME/toolchain/clang
          cd /tmp
          echo "正在下载 AOSP Clang r383902 ..."
          wget -q --tries=3 --retry-connrefused --waitretry=5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902.tar.gz" \
            -O clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/toolchain/clang
          $HOME/toolchain/clang/bin/clang --version | head -3

      - name: 下载 GCC 工具链 (Ubuntu 系统交叉编译器)
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "使用 Ubuntu 系统交叉编译器（gcc-aarch64-linux-gnu）"
          echo "GCC 版本: $(aarch64-linux-gnu-gcc --version | head -1)"
          echo "ARM32 版本: $(arm-linux-gnueabihf-gcc --version | head -1)"

      - name: 导出工具链环境变量
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH
          # 使用 Ubuntu 系统交叉编译器
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabihf-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=github-actions" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=cloud" >> $GITHUB_ENV
          # ccache 配置
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=time_macros,file_macro,include_file_mtime,ifdef" >> $GITHUB_ENV
          mkdir -p $HOME/.ccache
          ccache -M 2G -z
          echo "## ccache 已配置，缓存目录: $HOME/.ccache"

      - name: 克隆 OPPO Reno SDM710 内核源码
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "正在克隆 OPPO Reno SDM710 内核源码..."
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_REPO }}" kernel
          cd kernel
          echo "## 最近一次提交"
          git log -1 --format="%H %s (%ci)"
          echo "## 内核版本"
          make ARCH=arm64 kernelversion 2>&1 | head -3

      - name: 验证 vendor 源码完整性
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          cd kernel
          echo "## 验证 vendor 源码完整性..."
          # 内核源码已自带 vendor 目录，无需从外部仓库合并
          echo "## foreground_io_opt 源码检查:"
          if [ -d vendor/oplus/kernel/oplus_performance/foreground_io_opt ]; then
            echo "  ✓ 源码目录存在"
            ls -la vendor/oplus/kernel/oplus_performance/foreground_io_opt/ | head -10
          else
            echo "  ✗ 源码目录不存在"
          fi
          echo "## block/oppo_foreground_io_opt 符号链接:"
          ls -la block/oppo_foreground_io_opt 2>&1
          echo "## vendor 目录统计:"
          find vendor -name "Kconfig" | wc -l
          echo " 个 Kconfig 文件"

      - name: 集成 KernelSU-Next（仅 ksu-kpm 变体）
        if: steps.variant_gate.outputs.skip != 'true' && matrix.variant == 'ksu-kpm'
        run: |
          echo "正在集成 KernelSU-Next..."
          git clone --depth=1 -b "${{ env.KSU_BRANCH }}" "${{ env.KSU_REPO }}" KernelSU-Next
          cd kernel
          # setup.sh 必须在内核源码根目录运行
          # 它将 KernelSU 驱动符号链接到 drivers/kernelsu 并修改 Kconfig/Makefile
          ../KernelSU-Next/kernel/setup.sh
          echo "## 验证 KSU 集成"
          ls -la drivers/kernelsu 2>&1 || echo "未找到 drivers/kernelsu 符号链接"
          grep -l "KernelSU" drivers/Kconfig 2>&1 || echo "KSU 未添加到 drivers/Kconfig"

      - name: 集成 SukiSU-Ultra（仅 suki-kpm 变体）
        if: steps.variant_gate.outputs.skip != 'true' && matrix.variant == 'suki-kpm'
        run: |
          echo "正在集成 SukiSU-Ultra (builtin 分支)..."
          cd kernel
          # SukiSU-Ultra 使用 curl 管道方式运行 setup.sh
          # builtin 参数适用于非 GKI 内核（如 4.9）
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ env.SUKI_BRANCH }}/kernel/setup.sh" | bash -s builtin
          echo "## 验证 SukiSU 集成"
          ls -la drivers/kernelsu 2>&1 || echo "未找到 drivers/kernelsu 符号链接"
          grep -l "KernelSU\|SukiSU" drivers/Kconfig 2>&1 || echo "SukiSU 未添加到 drivers/Kconfig"

      - name: 应用内核配置（使用设备提取的 config）
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          cd kernel
          # 使用设备提取的 /proc/config.gz 解压后的 config 作为 .config
          echo "正在复制设备提取的内核配置..."
          cp $GITHUB_WORKSPACE/device_config .config
          # 追加 KPM 配置片段（kptools 需要 kallsyms）
          echo "正在追加 KPM 配置片段..."
          cat $GITHUB_WORKSPACE/configs/kpm.fragment >> .config
          # KSU 片段仅应用于 ksu-kpm 变体
          if [ "${{ matrix.variant }}" = "ksu-kpm" ]; then
            echo "正在追加 KernelSU 配置片段..."
            cat $GITHUB_WORKSPACE/configs/ksu.fragment >> .config
          fi
          # SukiSU 片段仅应用于 suki-kpm 变体
          if [ "${{ matrix.variant }}" = "suki-kpm" ]; then
            echo "正在追加 SukiSU 配置片段..."
            cat $GITHUB_WORKSPACE/configs/suki.fragment >> .config
          fi
          echo "## .config 行数: $(wc -l < .config)"
          echo "## OPPO_FG_IO_OPT 状态:"
          grep -E "OPPO_FG_IO_OPT" .config || echo "  (未设置)"
          echo "## KSU 状态:"
          grep -E "CONFIG_KSU" .config || echo "  (未设置)"
          echo "## KALLSYMS 状态:"
          grep -E "KALLSYMS" .config | head -5

      - name: 修复缺失的 Kconfig 和符号链接
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          cd kernel
          echo "正在修复缺失的 Kconfig 和符号链接..."
          
          # 1. 修复 block/oppo_foreground_io_opt 符号链接
          # 原始符号链接: block/oppo_foreground_io_opt -> ../../../vendor/oplus/kernel/oplus_performance/oppo_foreground_io_opt
          # 实际目录: vendor/oplus/kernel/oplus_performance/foreground_io_opt (无 oppo_ 前缀)
          # 需要创建 oppo_foreground_io_opt -> foreground_io_opt 的符号链接
          if [ -L block/oppo_foreground_io_opt ] && [ ! -e block/oppo_foreground_io_opt ]; then
            echo "  修复坏符号链接: block/oppo_foreground_io_opt"
            # 检查实际源码目录是否存在
            if [ -d vendor/oplus/kernel/oplus_performance/foreground_io_opt ]; then
              echo "  发现实际源码目录: vendor/oplus/kernel/oplus_performance/foreground_io_opt"
              # 创建 oppo_foreground_io_opt -> foreground_io_opt 符号链接
              ln -sf foreground_io_opt vendor/oplus/kernel/oplus_performance/oppo_foreground_io_opt
              echo "  已创建符号链接: oppo_foreground_io_opt -> foreground_io_opt"
              # 验证原始符号链接现在可以解析
              if [ -e block/oppo_foreground_io_opt ]; then
                echo "  原始符号链接已修复，可以正常解析"
                ls -la block/oppo_foreground_io_opt/
              else
                echo "  符号链接仍无法解析，创建目录替代"
                rm -f block/oppo_foreground_io_opt
                mkdir -p block/oppo_foreground_io_opt
                cp -r vendor/oplus/kernel/oplus_performance/foreground_io_opt/* block/oppo_foreground_io_opt/
              fi
            else
              echo "  源码目录不存在，创建 stub"
              rm -f block/oppo_foreground_io_opt
              mkdir -p block/oppo_foreground_io_opt
              printf '%s\n' \
                'config OPPO_FG_IO_OPT' \
                '	bool "OPPO foreground IO optimization"' \
                '	default n' \
                '	---help---' \
                '	  Source code not available.' \
                > block/oppo_foreground_io_opt/Kconfig
              printf '%s\n' '# Stub Makefile' > block/oppo_foreground_io_opt/Makefile
            fi
          fi
          
          # 2. 检查并修复其他坏符号链接
          find . -type l ! -exec test -e {} \; -print 2>/dev/null | while read -r linkpath; do
            linkdir=$(dirname "$linkpath")
            if find "$linkdir" -maxdepth 1 \( -name "Kconfig*" -o -name "Makefile" \) 2>/dev/null | grep -q .; then
              echo "  修复坏链接: $linkpath"
              rm -f "$linkpath"
              mkdir -p "$linkpath"
              [ ! -f "$linkpath/Kconfig" ] && printf '# Kconfig stub\n' > "$linkpath/Kconfig"
              [ ! -f "$linkpath/Makefile" ] && printf '# Makefile stub\n' > "$linkpath/Makefile"
            fi
          done
          
          # 3. 注释掉仍缺失的 Kconfig source 引用
          grep -rn 'source "' --include="Kconfig*" . 2>/dev/null | while IFS=: read -r kfile lineno content; do
            src=$(echo "$content" | sed -n 's/.*source "\(.*\)".*/\1/p')
            [ -z "$src" ] && continue
            kdir=$(dirname "$kfile")
            target="$kdir/$src"
            if [[ "$src" = /* ]]; then
              target=".$src"
            fi
            if [ ! -f "$target" ]; then
              echo "  注释掉缺失引用: $kfile:$lineno -> $src"
              sed -i "${lineno}s|^|# 已禁用(文件缺失): |" "$kfile"
            fi
          done
          echo "## 修复完成"

      - name: 编译内核
        if: steps.variant_gate.outputs.skip != 'true'
        env:
          CLANG_TRIPLE: aarch64-linux-android-
        run: |
          set -o pipefail
          cd kernel
          # 如果 python2 不可用，修复 Python 2 脚本兼容性
          if ! python --version 2>&1 | grep -q "Python 2"; then
            echo "## python2 不可用，修复 Python 2 脚本兼容性..."
            # 修复 gcc-wrapper.py 的 print 语句
            if [ -f scripts/gcc-wrapper.py ]; then
              python3 -c "
              import re
              with open('scripts/gcc-wrapper.py', 'r') as f:
                  s = f.read()
              # print >> sys.stderr, X -> print(X, file=sys.stderr)
              s = re.sub(r'print >> sys\.stderr, (.+)', lambda m: 'print(' + m.group(1) + ', file=sys.stderr)', s)
              with open('scripts/gcc-wrapper.py', 'w') as f:
                  f.write(s)
              "
              echo "  已修复 gcc-wrapper.py"
            fi
            # 修复其他常见 Python 2 脚本
            find scripts -name "*.py" -exec python3 -c "
              import sys, re
              for fn in sys.argv[1:]:
                  with open(fn) as f: s = f.read()
                  if 'print >>' in s:
                      s = re.sub(r'print >> sys\.stderr, (.+)', lambda m: 'print(' + m.group(1) + ', file=sys.stderr)', s)
                      s = re.sub(r'print >> sys\.stdout, (.+)', lambda m: 'print(' + m.group(1) + ', file=sys.stdout)', s)
                      with open(fn, 'w') as f: f.write(s)
                      print(f'  已修复 {fn}')
              " {} +
          fi
          echo "## 调试信息: CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "## 调试信息: CROSS_COMPILE=$CROSS_COMPILE"
          echo "## 调试信息: GCC=$(${CROSS_COMPILE}gcc --version 2>&1 | head -1)"
          # 使用设备提取的 .config，通过 olddefconfig 更新
          echo "## 正在运行 make olddefconfig（基于设备配置）"
          make ARCH=arm64 olddefconfig
          echo "## 验证关键配置项"
          grep -E "CONFIG_(KALLSYMS|KALLSYMS_ALL|KSU|KPM|KPROBES|OPPO_FG_IO_OPT)" .config || true
          echo "## 正在编译内核（约需 30-60 分钟，已启用 ccache）"
          echo "## 编译前 ccache 统计:"
          ccache -s
          # 正式编译（通过 ccache 调用交叉编译器，cc-name 仍检测为 gcc）
          make ARCH=arm64 -j"$(nproc)" \
            CC="ccache aarch64-linux-gnu-gcc" \
            HOSTCC="ccache gcc" HOSTCXX="ccache g++" \
            2>&1 | tee /tmp/kernel_build.log | tail -500
          echo "## 编译后 ccache 统计:"
          ccache -s
          echo "## 编译产物"
          ls -la arch/arm64/boot/
          # 检查内核镜像是否存在
          if [ ! -f arch/arm64/boot/Image ] && [ ! -f arch/arm64/boot/Image.gz ]; then
            echo "## 错误: 内核镜像未生成！显示最后 200 行日志:"
            tail -200 /tmp/kernel_build.log
            exit 1
          fi

      - name: 编译 KernelPatch (kpimg + kptools)
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "正在克隆并编译 KernelPatch..."
          git clone --depth=1 "${{ env.KPM_REPO }}" KernelPatch
          cd KernelPatch
          echo "## TARGET_COMPILE=aarch64-linux-gnu-"
          # 禁用 stack-protector（Ubuntu GCC 默认启用，KernelPatch 不需要）
          sed -i 's/-Wall/-Wall -fno-stack-protector -fno-pie/g' kernel/Makefile
          echo "## 编译 kpimg"
          make -C kernel kpimg TARGET_COMPILE=aarch64-linux-gnu-
          echo "## 编译 kptools"
          # 将 kernel 目录中生成的头文件链接到 tools 目录（不修改 include 路径，避免系统头文件冲突）
          find kernel -name "preset.h" -exec ln -sf "$(pwd)/{}" tools/preset.h \; 2>/dev/null || true
          find kernel -name "kpimg.h" -exec ln -sf "$(pwd)/{}" tools/kpimg.h \; 2>/dev/null || true
          find kernel -name "patch.h" -exec ln -sf "$(pwd)/{}" tools/patch.h \; 2>/dev/null || true
          find kernel -name "kallsym.h" -exec ln -sf "$(pwd)/{}" tools/kallsym.h \; 2>/dev/null || true
          find kernel -name "elf.h" -exec ln -sf "$(pwd)/{}" tools/elf.h \; 2>/dev/null || true
          make -C tools
          echo "## 验证产物"
          ls -la kernel/kpimg tools/kptools

      - name: 注入 KPM 补丁到内核镜像
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          cd kernel
          KERNEL_IMAGE=""
          for f in arch/arm64/boot/Image.gz-dtb arch/arm64/boot/Image.gz arch/arm64/boot/Image; do
            if [ -f "$f" ]; then KERNEL_IMAGE="$f"; break; fi
          done
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "错误: 在 arch/arm64/boot/ 未找到内核镜像"
            ls -la arch/arm64/boot/
            exit 1
          fi
          echo "使用的内核镜像: $KERNEL_IMAGE ($(stat -c%s "$KERNEL_IMAGE") 字节)"
          
          cd "$GITHUB_WORKSPACE/KernelPatch"
          echo "## 正在使用 kptools 注入 KPM 补丁"
          ./tools/kptools -p kernel/kpimg -i "$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE" \
            -o "$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE.kpatched"
          echo "## 补丁后镜像大小: $(stat -c%s $GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE.kpatched) 字节"
          # 用补丁后的版本替换原始镜像
          cp "$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE.kpatched" "$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE"

      - name: 使用 AnyKernel3 打包可刷入 zip
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "正在使用 AnyKernel3 打包..."
          git clone --depth=1 "${{ env.ANYKERNEL3_REPO }}" anykernel3
          cp $GITHUB_WORKSPACE/anykernel3.cfg anykernel3/anykernel3.cfg
          
          KERNEL_IMAGE=""
          for f in arch/arm64/boot/Image.gz-dtb arch/arm64/boot/Image.gz arch/arm64/boot/Image; do
            if [ -f "kernel/$f" ]; then KERNEL_IMAGE="kernel/$f"; break; fi
          done
          cp "$KERNEL_IMAGE" anykernel3/Image
          
          cd anykernel3
          DATE=$(date +%Y%m%d)
          ZIP_NAME="OPPO-Reno-SDM710-${{ matrix.variant }}-${DATE}.zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" *
          echo "## 最终 zip 包: $ZIP_NAME"
          ls -la "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: 上传产物
        if: steps.variant_gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-Reno-SDM710-${{ matrix.variant }}
          path: ${{ github.workspace }}/OPPO-Reno-SDM710-*.zip
          retention-days: 30
          compression-level: 0


  summary:
    name: 编译汇总
    needs: build
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: 汇总信息
        run: |
          echo "## 编译汇总"
          echo "所有变体编译已尝试完成。请从上方各编译任务下载产物。"
          echo "- kpm-only: 仅支持 KPM 模块，不含 KernelSU"
          echo "- ksu-kpm: 同时支持 KernelSU-Next 和 KPM 模块"
          echo "- suki-kpm: 同时支持 SukiSU-Ultra 和 KPM 模块"
