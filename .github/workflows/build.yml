name: 编译 OPPO Reno SDM710 内核 (KPM / KSU+KPM / SukiSU+KPM)

on:
  workflow_dispatch:
    inputs:
      build_kpm_only:
        description: '编译 KPM-only 版本（不含 KernelSU）'
        type: boolean
        default: true
      build_ksu_kpm:
        description: '编译 KernelSU + KPM 版本'
        type: boolean
        default: true
      build_suki_kpm:
        description: '编译 SukiSU + KPM 版本'
        type: boolean
        default: true
  push:
    branches: [main, master]

env:
  # OPPO Reno (SDM710) 内核源码
  KERNEL_REPO: https://github.com/oppo-source/android_kernel_oppo_sdm710
  KERNEL_BRANCH: oppo/sdm710_r_11.0_reno
  DEFCONFIG: sdm670-perf_defconfig
  # KernelSU-Next（4.9 内核 FULL 源码集成）
  KSU_REPO: https://github.com/KernelSU-Next/KernelSU-Next
  KSU_BRANCH: dev
  # SukiSU-Ultra（KernelSU 增强分支，内置 KPM）
  SUKI_REPO: https://github.com/SukiSU-Ultra/SukiSU-Ultra
  SUKI_BRANCH: main
  # KernelPatch (KPM) - kpimg + kptools
  KPM_REPO: https://github.com/bmax121/KernelPatch
  # AnyKernel3 打包工具
  ANYKERNEL3_REPO: https://github.com/osm0sis/AnyKernel3
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    name: 编译 ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [kpm-only, ksu-kpm, suki-kpm]

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 判断是否跳过该变体
        id: variant_gate
        run: |
          SKIP="false"
          if [ "${{ matrix.variant }}" = "kpm-only" ] && [ "${{ github.event.inputs.build_kpm_only }}" = "false" ]; then SKIP="true"; fi
          if [ "${{ matrix.variant }}" = "ksu-kpm" ] && [ "${{ github.event.inputs.build_ksu_kpm }}" = "false" ]; then SKIP="true"; fi
          if [ "${{ matrix.variant }}" = "suki-kpm" ] && [ "${{ github.event.inputs.build_suki_kpm }}" = "false" ]; then SKIP="true"; fi
          echo "skip=$SKIP" >> $GITHUB_OUTPUT
          echo "输入参数: kpm_only=${{ github.event.inputs.build_kpm_only }} ksu_kpm=${{ github.event.inputs.build_ksu_kpm }} suki_kpm=${{ github.event.inputs.build_suki_kpm }}"

      - name: 跳过已禁用的变体
        if: steps.variant_gate.outputs.skip == 'true'
        run: |
          echo "变体 ${{ matrix.variant }} 已被禁用，跳过编译。"
          exit 0

      - name: 释放磁盘空间
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "== 清理前磁盘使用 =="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          echo "== 清理后磁盘使用 =="
          df -h /

      - name: 安装编译依赖
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libncurses5-dev libssl-dev libelf-dev \
            zip unzip curl wget git python3 ccache lld

      - name: 下载 Clang 工具链 (AOSP r383902 / Clang 11)
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          mkdir -p $HOME/toolchain/clang
          cd /tmp
          echo "正在下载 AOSP Clang r383902 ..."
          wget -q --tries=3 --retry-connrefused --waitretry=5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902.tar.gz" \
            -O clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/toolchain/clang
          $HOME/toolchain/clang/bin/clang --version | head -3

      - name: 下载 GCC 工具链 (aarch64-linux-android-4.9)
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          mkdir -p $HOME/toolchain/gcc
          cd /tmp
          echo "正在下载 AOSP GCC 4.9 ..."
          wget -q --tries=3 --retry-connrefused --waitretry=5 \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r48.tar.gz" \
            -O gcc.tar.gz
          tar -xzf gcc.tar.gz -C $HOME/toolchain/gcc
          ls $HOME/toolchain/gcc/bin/ | head -5

      - name: 导出工具链环境变量
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "$HOME/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$HOME/toolchain/gcc/bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$HOME/toolchain/gcc/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=$HOME/toolchain/gcc/bin/arm-linux-androideabi-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=github-actions" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=cloud" >> $GITHUB_ENV

      - name: 克隆 OPPO Reno SDM710 内核源码
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "正在克隆 OPPO Reno SDM710 内核源码..."
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_REPO }}" kernel
          cd kernel
          echo "## 最近一次提交"
          git log -1 --format="%H %s (%ci)"
          echo "## 内核版本"
          make ARCH=arm64 kernelversion 2>&1 | head -3

      - name: 集成 KernelSU-Next（仅 ksu-kpm 变体）
        if: steps.variant_gate.outputs.skip != 'true' && matrix.variant == 'ksu-kpm'
        run: |
          echo "正在集成 KernelSU-Next..."
          git clone --depth=1 -b "${{ env.KSU_BRANCH }}" "${{ env.KSU_REPO }}" KernelSU-Next
          cd kernel
          # setup.sh 必须在内核源码根目录运行
          # 它将 KernelSU 驱动符号链接到 drivers/kernelsu 并修改 Kconfig/Makefile
          ../KernelSU-Next/kernel/setup.sh
          echo "## 验证 KSU 集成"
          ls -la drivers/kernelsu 2>&1 || echo "未找到 drivers/kernelsu 符号链接"
          grep -l "KernelSU" drivers/Kconfig 2>&1 || echo "KSU 未添加到 drivers/Kconfig"

      - name: 集成 SukiSU-Ultra（仅 suki-kpm 变体）
        if: steps.variant_gate.outputs.skip != 'true' && matrix.variant == 'suki-kpm'
        run: |
          echo "正在集成 SukiSU-Ultra (builtin 分支)..."
          cd kernel
          # SukiSU-Ultra 使用 curl 管道方式运行 setup.sh
          # builtin 参数适用于非 GKI 内核（如 4.9）
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ env.SUKI_BRANCH }}/kernel/setup.sh" | bash -s builtin
          echo "## 验证 SukiSU 集成"
          ls -la drivers/kernelsu 2>&1 || echo "未找到 drivers/kernelsu 符号链接"
          grep -l "KernelSU\|SukiSU" drivers/Kconfig 2>&1 || echo "SukiSU 未添加到 drivers/Kconfig"

      - name: 应用内核配置片段
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          cd kernel
          # KPM 片段应用于所有变体（kptools 需要 kallsyms）
          echo "正在应用 KPM 配置片段..."
          cat $GITHUB_WORKSPACE/configs/kpm.fragment >> arch/arm64/configs/${{ env.DEFCONFIG }}
          # KSU 片段仅应用于 ksu-kpm 变体
          if [ "${{ matrix.variant }}" = "ksu-kpm" ]; then
            echo "正在应用 KernelSU 配置片段..."
            cat $GITHUB_WORKSPACE/configs/ksu.fragment >> arch/arm64/configs/${{ env.DEFCONFIG }}
          fi
          # SukiSU 片段仅应用于 suki-kpm 变体
          if [ "${{ matrix.variant }}" = "suki-kpm" ]; then
            echo "正在应用 SukiSU 配置片段..."
            cat $GITHUB_WORKSPACE/configs/suki.fragment >> arch/arm64/configs/${{ env.DEFCONFIG }}
          fi
          echo "## ${{ env.DEFCONFIG }} 最后 25 行"
          tail -25 arch/arm64/configs/${{ env.DEFCONFIG }}

      - name: 编译内核
        if: steps.variant_gate.outputs.skip != 'true'
        env:
          CLANG_TRIPLE: aarch64-linux-android-
        run: |
          cd kernel
          echo "## 调试信息: CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "## 调试信息: CROSS_COMPILE=$CROSS_COMPILE"
          echo "## 调试信息: CC=$(which clang)"
          clang --version | head -2
          echo "## 正在从 ${{ env.DEFCONFIG }} 生成 .config"
          make ARCH=arm64 ${{ env.DEFCONFIG }} \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            CLANG_TRIPLE=aarch64-linux-android-
          echo "## 验证关键配置项"
          grep -E "CONFIG_(KALLSYMS|KALLSYMS_ALL|KSU|KPM|KPROBES|OVERLAY_FS|FUSE_FS)" .config || true
          echo "## 正在编译内核（约需 30-60 分钟）"
          make ARCH=arm64 -j"$(nproc)" \
            CC=clang HOSTCC=clang HOSTCXX=clang++ \
            CLANG_TRIPLE=aarch64-linux-android- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump 2>&1 | tail -300
          echo "## 编译产物"
          ls -la arch/arm64/boot/

      - name: 编译 KernelPatch (kpimg + kptools)
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "正在克隆并编译 KernelPatch..."
          git clone --depth=1 "${{ env.KPM_REPO }}" KernelPatch
          cd KernelPatch
          echo "## 编译 kpimg"
          make -C kernel kpimg
          echo "## 编译 kptools"
          make -C tools
          echo "## 验证产物"
          ls -la kernel/kpimg tools/kptools

      - name: 注入 KPM 补丁到内核镜像
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          cd kernel
          KERNEL_IMAGE=""
          for f in arch/arm64/boot/Image.gz-dtb arch/arm64/boot/Image.gz arch/arm64/boot/Image; do
            if [ -f "$f" ]; then KERNEL_IMAGE="$f"; break; fi
          done
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "错误: 在 arch/arm64/boot/ 未找到内核镜像"
            ls -la arch/arm64/boot/
            exit 1
          fi
          echo "使用的内核镜像: $KERNEL_IMAGE ($(stat -c%s "$KERNEL_IMAGE") 字节)"
          
          cd "$GITHUB_WORKSPACE/KernelPatch"
          echo "## 正在使用 kptools 注入 KPM 补丁"
          ./tools/kptools -p kernel/kpimg -i "$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE" \
            -o "$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE.kpatched"
          echo "## 补丁后镜像大小: $(stat -c%s $GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE.kpatched) 字节"
          # 用补丁后的版本替换原始镜像
          cp "$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE.kpatched" "$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE"

      - name: 使用 AnyKernel3 打包可刷入 zip
        if: steps.variant_gate.outputs.skip != 'true'
        run: |
          echo "正在使用 AnyKernel3 打包..."
          git clone --depth=1 "${{ env.ANYKERNEL3_REPO }}" anykernel3
          cp $GITHUB_WORKSPACE/anykernel3.cfg anykernel3/anykernel3.cfg
          
          KERNEL_IMAGE=""
          for f in arch/arm64/boot/Image.gz-dtb arch/arm64/boot/Image.gz arch/arm64/boot/Image; do
            if [ -f "kernel/$f" ]; then KERNEL_IMAGE="kernel/$f"; break; fi
          done
          cp "$KERNEL_IMAGE" anykernel3/Image
          
          cd anykernel3
          DATE=$(date +%Y%m%d)
          ZIP_NAME="OPPO-Reno-SDM710-${{ matrix.variant }}-${DATE}.zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" *
          echo "## 最终 zip 包: $ZIP_NAME"
          ls -la "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: 上传产物
        if: steps.variant_gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-Reno-SDM710-${{ matrix.variant }}
          path: ${{ github.workspace }}/OPPO-Reno-SDM710-*.zip
          retention-days: 30
          compression-level: 0

  summary:
    name: 编译汇总
    needs: build
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: 汇总信息
        run: |
          echo "## 编译汇总"
          echo "所有变体编译已尝试完成。请从上方各编译任务下载产物。"
          echo "- kpm-only: 仅支持 KPM 模块，不含 KernelSU"
          echo "- ksu-kpm: 同时支持 KernelSU-Next 和 KPM 模块"
          echo "- suki-kpm: 同时支持 SukiSU-Ultra 和 KPM 模块"
